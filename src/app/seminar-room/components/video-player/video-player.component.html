<ng-container *ngIf="isOneDrive; else driveEmbed">
    <!-- OneDrive / SharePoint: embed directly in iframe.
         The Stream player needs more height than 16:9 gives on narrow phones,
         otherwise its control bar gets clipped, so enforce a min height. -->
    <div
        class="video-container relative w-full aspect-video min-h-[260px] sm:min-h-0 overflow-hidden bg-black rounded-lg shadow-md border border-border">
        <iframe [src]="videoId | safeUrl" class="absolute inset-0 w-full h-full border-0" scrolling="no"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen
            title="Seminar video">
        </iframe>
    </div>
</ng-container>

<ng-template #driveEmbed>
    <!-- Google Drive: standard iframe embed.
         Its mobile player needs ~300px of height to show the play and settings controls. -->
    <div
        class="video-container relative w-full aspect-video min-h-[300px] sm:min-h-0 overflow-hidden bg-black rounded-lg shadow-md border border-border">
        <iframe [src]="embedUrl | safeUrl" class="absolute inset-0 w-full h-full border-0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
        <!-- Overlay to block the pop-out button in the top right (desktop only, it covers player UI on small screens) -->
        <div class="hidden sm:block absolute top-0 right-0 w-[60px] h-[60px] z-10 pointer-events-auto bg-transparent cursor-default">
        </div>
    </div>
</ng-template>
